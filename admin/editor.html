<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editor de publicações de Cavalleiro de Macedo Advocacia.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#18302d">

    <link rel="icon" href="../assets/brand/cavalleiro-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"
        integrity="sha384-ecIckRi4QlKYya/FQUbBUjS4qp65jF/J87Guw5uzTbO1C1Jfa/6kYmd6dXUF6D7i"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../css/admin.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"
        defer
    ></script>
    <script src="../js/supabase.js" defer></script>
    <script
        src="https://cdn.jsdelivr.net/npm/dompurify@3.4.13/dist/purify.min.js"
        integrity="sha384-ZuC+DIACqSIZTsp+7YF57cR5Y+6qXa7YFbEKdA/EHA/R0T+41dtorqucYl71Zp+t"
        crossorigin="anonymous"
        defer
    ></script>
    <script
        src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"
        integrity="sha384-utBUCeG4SYaCm4m7GQZYr8Hy8Fpy3V4KGjBZaf4WTKOcwhCYpt/0PfeEe3HNlwx8"
        crossorigin="anonymous"
        defer
    ></script>
    <script src="../js/admin-editor.js" defer></script>

    <title>Novo artigo | Cavalleiro de Macedo</title>
</head>

<body class="admin-body admin-body--panel">
    <p class="admin-editor__loading" role="status" data-editor-loading>
        Carregando editor…
    </p>

    <main class="admin-editor" hidden data-admin-editor>
        <header class="admin-panel__header">
            <a
                class="admin-brand"
                href="../index.html"
                aria-label="Cavalleiro de Macedo Advocacia — abrir o site"
            >
                <img src="../assets/brand/cavalleiro-mark.svg" alt="">

                <span>
                    <strong>Cavalleiro de Macedo</strong>
                    <small>Administração</small>
                </span>
            </a>

            <a class="admin-editor__back" href="./painel.html">← Voltar ao painel</a>
        </header>

        <section class="admin-editor__heading" aria-labelledby="editor-title">
            <span data-editor-eyebrow>Novo artigo</span>
            <h1 id="editor-title" data-editor-title>Escrever publicação</h1>
            <p>
                Escreva e formate o conteúdo como em um editor de texto comum.
            </p>
        </section>

        <form class="admin-editor__form" data-editor-form>
            <label class="admin-field admin-field--wide" for="post-title">
                <span>Título</span>
                <input
                    id="post-title"
                    type="text"
                    name="title"
                    maxlength="180"
                    autocomplete="off"
                    required
                    data-post-title
                >
            </label>

            <label class="admin-field admin-field--compact" for="post-category">
                <span>Categoria</span>
                <select id="post-category" name="category" data-post-category>
                    <option value="">Selecione uma categoria</option>
                    <option value="Direito Público e Administrativo">Direito Público e Administrativo</option>
                    <option value="Direito do Trabalho">Direito do Trabalho</option>
                    <option value="Direito Civil">Direito Civil</option>
                    <option value="Direito do Consumidor">Direito do Consumidor</option>
                    <option value="Direito Bancário">Direito Bancário</option>
                    <option value="Direito Ambiental">Direito Ambiental</option>
                    <option value="Direito Constitucional">Direito Constitucional</option>
                    <option value="Direito Imobiliário">Direito Imobiliário</option>
                    <option value="Atuação Extrajudicial">Atuação Extrajudicial</option>
                </select>
            </label>

            <label class="admin-field admin-field--wide" for="post-excerpt">
                <span>Resumo</span>
                <textarea
                    id="post-excerpt"
                    name="excerpt"
                    rows="4"
                    maxlength="360"
                    data-post-excerpt
                ></textarea>
                <small>Texto curto exibido nos cards e abaixo do título do artigo.</small>
            </label>

            <div class="admin-field admin-field--wide">
                <span id="post-content-label">Conteúdo</span>

                <div class="admin-rich-editor">
                    <div
                        class="admin-editor__toolbar"
                        id="editor-toolbar"
                        role="toolbar"
                        aria-label="Formatação do conteúdo"
                    >
                        <span class="ql-formats">
                            <select
                                class="ql-header"
                                aria-label="Estilo do texto"
                                title="Estilo do texto"
                            >
                                <option value="2">Título</option>
                                <option value="3">Subtítulo</option>
                                <option selected>Texto</option>
                            </select>
                        </span>

                        <span class="ql-formats">
                            <button class="ql-bold" type="button" aria-label="Negrito" title="Negrito"></button>
                            <button class="ql-italic" type="button" aria-label="Itálico" title="Itálico"></button>
                        </span>

                        <span class="ql-formats">
                            <button
                                class="ql-list"
                                type="button"
                                value="ordered"
                                aria-label="Lista numerada"
                                title="Lista numerada"
                            ></button>
                            <button
                                class="ql-list"
                                type="button"
                                value="bullet"
                                aria-label="Lista com marcadores"
                                title="Lista com marcadores"
                            ></button>
                        </span>

                        <span class="ql-formats">
                            <button class="ql-blockquote" type="button" aria-label="Citação" title="Citação"></button>
                            <button class="ql-link" type="button" aria-label="Inserir link" title="Inserir link"></button>
                        </span>

                        <span class="ql-formats">
                            <button
                                class="ql-clean"
                                type="button"
                                aria-label="Remover formatação"
                                title="Remover formatação"
                            ></button>
                        </span>
                    </div>

                    <div
                        id="post-content-editor"
                        data-post-content-editor
                    ></div>
                </div>

                <small id="content-help">
                    Use títulos, listas, citações e links para organizar o artigo.
                </small>
            </div>

            <div class="admin-editor__footer admin-field--wide">
                <p
                    class="admin-editor__status"
                    role="status"
                    aria-live="polite"
                    data-editor-status
                ></p>

                <div class="admin-editor__actions">
                    <button
                        class="admin-button admin-button--secondary"
                        type="submit"
                        value="save"
                        data-save
                    >
                        Salvar rascunho
                    </button>

                    <button
                        class="admin-button"
                        type="submit"
                        value="publish"
                        data-primary-action
                    >
                        Publicar
                    </button>
                </div>
            </div>
        </form>
    </main>

    <noscript>
        <p class="admin-noscript">Ative o JavaScript para usar o editor administrativo.</p>
    </noscript>
</body>
</html>
