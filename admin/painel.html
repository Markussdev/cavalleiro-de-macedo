<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Painel administrativo de Cavalleiro de Macedo Advocacia.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#18302d">

    <link rel="icon" href="../assets/brand/cavalleiro-mark.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../css/admin.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"
        defer
    ></script>
    <script src="../js/supabase.js" defer></script>
    <script src="../js/admin-panel.js" defer></script>

    <title>Painel | Cavalleiro de Macedo</title>
</head>

<body class="admin-body admin-body--panel">
    <main class="admin-panel" hidden data-admin-panel>
        <header class="admin-panel__header">
            <a
                class="admin-brand"
                href="../index.html"
                aria-label="Cavalleiro de Macedo Advocacia — abrir o site"
            >
                <img src="../assets/brand/cavalleiro-mark.svg" alt="">

                <span>
                    <strong>Cavalleiro de Macedo</strong>
                    <small>Administração</small>
                </span>
            </a>

            <button class="admin-logout" type="button" data-logout>
                Sair
            </button>
        </header>

        <section class="admin-panel__intro" aria-labelledby="panel-title">
            <div>
                <span>Visão geral</span>
                <h1 id="panel-title">Olá, <span data-admin-name>Roberto</span>.</h1>
                <p>Veja o que precisa da sua atenção hoje.</p>
            </div>

            <div class="admin-panel__actions">
                <a
                    class="admin-button admin-button--secondary"
                    href="./editor.html"
                >
                    Novo artigo
                    <span aria-hidden="true">＋</span>
                </a>

                <a class="admin-button" href="./imovel.html">
                    Novo imóvel
                    <span aria-hidden="true">＋</span>
                </a>
            </div>
        </section>

        <p class="admin-panel__status" role="status" aria-live="polite" data-panel-status>
            Carregando painel…
        </p>

        <section class="admin-requests" aria-labelledby="requests-title">
            <div class="admin-posts__heading">
                <h2 id="requests-title">Solicitações</h2>
                <span data-requests-count>0 novas</span>
            </div>

            <div
                class="admin-requests__list"
                data-legal-requests
                aria-live="polite"
            ></div>
        </section>

        <section
            class="admin-property-leads"
            aria-labelledby="property-leads-title"
        >
            <div class="admin-posts__heading">
                <h2 id="property-leads-title">Interesses em imóveis</h2>
                <span data-property-leads-count>0 novos</span>
            </div>

            <div
                class="admin-requests__list"
                data-property-leads
                aria-live="polite"
            ></div>
        </section>

        <section class="admin-properties" aria-labelledby="properties-title">
            <div class="admin-posts__heading">
                <h2 id="properties-title">Imóveis</h2>
                <span data-properties-count>0</span>
            </div>

            <div
                class="admin-posts__list"
                data-properties
                aria-live="polite"
            ></div>
        </section>

        <section class="admin-posts" aria-labelledby="published-title">
            <div class="admin-posts__heading">
                <h2 id="published-title">Publicados</h2>
                <span data-published-count>0</span>
            </div>

            <div class="admin-posts__list" data-published-posts></div>
        </section>

        <section class="admin-posts" aria-labelledby="drafts-title">
            <div class="admin-posts__heading">
                <h2 id="drafts-title">Rascunhos</h2>
                <span data-drafts-count>0</span>
            </div>

            <div class="admin-posts__list" data-draft-posts></div>
        </section>
    </main>

    <noscript>
        <p class="admin-noscript">Ative o JavaScript para acessar o painel administrativo.</p>
    </noscript>
</body>
</html>
